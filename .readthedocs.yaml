# the docs moved to README.md: serve a redirect for every page, incl. old links (404.html)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp docs/rtd-moved.html $READTHEDOCS_OUTPUT/html/index.html
    - cp docs/rtd-moved.html $READTHEDOCS_OUTPUT/html/404.html
