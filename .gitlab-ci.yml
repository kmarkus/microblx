stages:
  - build
  - test
  - docs
  - deploy

image: gcc:trixie

.setup_deps:
  before_script:
    - apt update && apt -y install cmake pkg-config gcc g++ git-core luajit libluajit-5.1-dev uthash-dev cppcheck libcmocka-dev libsystemd-dev libmxml-dev lua-compat53 lua-compat53-dev dbus libgpiod-dev libiio-dev libiio-utils libgps-dev gpsd libcap2-bin lua-json
    - cd /builds/
    - git clone --depth=1 https://github.com/kmarkus/uutils.git
    - git clone --depth=1 https://github.com/corsix/ffi-reflect.git
    - git clone --depth=1 https://github.com/kmarkus/lsdbus.git
    - git clone --depth=1 --branch LUAUNIT_V3_5 https://github.com/bluebird75/luaunit.git
    - git clone --depth=1 --branch v1.5 https://github.com/gvvaughan/optparse.git
    # install reflect
    - install -d /usr/local/share/lua/5.1/
    - cp ffi-reflect/reflect.lua /usr/local/share/lua/5.1/
    # install optparse (required by ubx-launch and ubx-dbus)
    - install -d /usr/local/share/lua/5.1/optparse/
    - cp optparse/lib/optparse/*.lua /usr/local/share/lua/5.1/optparse/
    # install luaunit from git (3.5 with improved setup/teardown error handling)
    - cp luaunit/luaunit.lua /usr/local/share/lua/5.1/
    # install uutils
    - cd uutils/
    - make install
    - cd ..
    # install lsdbus
    - cd lsdbus
    - mkdir build && cd build
    - cmake .. -DCONFIG_LUA_VER=jit
    - make -j3
    - make install
    - ldconfig
    - cd ../..

build:
  stage: build
  extends: .setup_deps
  script:
    - cd $CI_PROJECT_DIR
    - mkdir build && pushd build
    - cmake -DBLOCK_LSDB_INTF=ON ..
    # - make cppcheck
    - make -j10
    - popd
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

test:
  # NOTE: SCHED_DEADLINE tests require CAP_SYS_NICE. Grant it by adding
  #   cap_add = ["SYS_NICE"]
  # to the [runners.docker] section of the runner's config.toml.
  stage: test
  extends: .setup_deps
  script:
    - cd $CI_PROJECT_DIR
    - pushd build
    - make install && ldconfig
    - popd
    - export JUNIT_OUTPUT=test-results.xml
    - mkdir -p /run/dbus
    - dbus-run-session --config-file tests/dbus-test.conf -- ./run_tests.sh
    # run lfq tests (default cap 4 and the single-slot mailbox path)
    - test-lfq
    - test-lfq -c 1 -t 8 -o 50000
    - test-lfq-unit
    # run the rtlog stress test (multi-writer/multi-reader shm log
    # verification): defaults, high contention and the SPSC fast path
    - test-rtlog
    - test-rtlog -w 32 -r 8 -n 50
    - test-rtlog -w 1 -r 1 -n 20
  artifacts:
    when: always
    reports:
      junit: test-results.xml

# run the lock-free queue tests under ThreadSanitizer
test-lfq-tsan:
  stage: test
  before_script:
    - apt update && apt -y install libcmocka-dev
  script:
    - gcc -fsanitize=thread -g -O1 -Iliblfq liblfq/test-lfq-unit.c liblfq/lfq.c -lcmocka -lpthread -o tsan-lfq-unit
    - ./tsan-lfq-unit
    - gcc -fsanitize=thread -g -O1 -Iliblfq liblfq/test-lfq.c liblfq/lfq.c -lpthread -o tsan-lfq
    - ./tsan-lfq -c 1 -t 4 -o 20000
    - ./tsan-lfq -c 4 -t 4 -o 20000

# run the rtlog stress test under ThreadSanitizer (validates the shm
# writer mutex and the release/acquire publication of the write offset)
test-rtlog-tsan:
  stage: test
  before_script:
    - apt update && apt -y install uthash-dev
  script:
    # rtlog.c includes the cmake-generated config.h; an empty one is
    # fine for this standalone build
    - touch config.h
    - gcc -fsanitize=thread -g -O1 -Ilibubx -I. tools/test-rtlog.c libubx/rtlog.c libubx/rtlog_client.c libubx/ubx_time.c -lpthread -lrt -o tsan-rtlog
    - ./tsan-rtlog -w 8 -r 4 -n 10
    - ./tsan-rtlog -w 32 -r 8 -n 5
    - ./tsan-rtlog -w 1 -r 1 -n 10

examples:
  stage: test
  extends: .setup_deps
  script:
    - cd $CI_PROJECT_DIR
    - pushd build
    - make install && ldconfig
    - popd
    # test generating an out-of-tree block
    - ubx-genblock -d /tmp/testblock/ -c examples/blockmodels/block_model_example.lua
    - pushd /tmp/testblock/
    - ./bootstrap && ./configure && make && make install
    - ubx-launch -t 1 -c myblock.usc
    - popd
    # test generating an out-of-tree cpp block
    - ubx-genblock -cpp -d /tmp/testblock-cpp/ -c examples/blockmodels/block_model_example.lua
    - pushd /tmp/testblock-cpp/
    - ./bootstrap && ./configure && make && make install
    - ubx-launch -t 1 -c myblock.usc
    - popd
    # run the threshold example
    - ubx-launch -t 3 -s -check unconn_inports,unconn_outports -c examples/usc/threshold.usc
    # run the pid example
    - pushd /usr/local/share/ubx/examples/usc/pid/
    - ubx-launch -t 3 -s -check unconn_inports,unconn_outports -c pid_test.usc,ptrig_nrt.usc
    - popd
    # build and run tutorial
    # platform_2dof
    - ubx-genblock -c examples/platform/platform_2dof.lua -d /tmp/platform_2dof/
    - cp examples/platform/platform_2dof.c /tmp/platform_2dof/
    - pushd /tmp/platform_2dof/
    - ./bootstrap && ./configure && make && make install
    - popd
    # platform_2dof_control
    - ubx-genblock -c examples/platform/platform_2dof_control.lua -d /tmp/platform_2dof_control/
    - cp examples/platform/platform_2dof_control.c /tmp/platform_2dof_control/
    - pushd /tmp/platform_2dof_control/
    - ./bootstrap && ./configure && make && make install
    - popd
    # run the tutorial usc
    - ubx-launch -t 2 -c examples/platform/platform_launch/platform_2dof_and_control.usc
    # build the c-launch example
    - pushd examples/platform/platform_launch
    - autoreconf -i && ./configure && make
    - popd
    # build the minimal c-launch example and run it
    - pushd examples/C/
    - gcc -Wall -Werror c-launch.c -o c-launch -lubx
    - ./c-launch 1

lua-docs:
  stage: docs
  image: gcc:trixie
  before_script:
    - apt update && apt -y install luajit lua-ldoc lua-discount
  script:
    - cd docs/lua && luajit $(which ldoc) --config config.ld --dir /tmp/lua-docs .
  allow_failure: true

pages:
  stage: deploy
  image: gcc:trixie
  before_script:
    - apt update && apt -y install luajit lua-ldoc lua-discount
  script:
    - cd docs/lua && luajit $(which ldoc) --config config.ld --dir $CI_PROJECT_DIR/public .
  artifacts:
    paths:
      - public
  only:
    - master
    - dev
  allow_failure: true
